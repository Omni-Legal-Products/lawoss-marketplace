<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-light-title hero-light-desc">
  <title id="hero-light-title">lawoss-marketplace: katalóg právnych MCP pluginov LAWOSS</title>
  <desc id="hero-light-desc">Katalóg pluginov LAWOSS: agent nainštaluje plugin s runtime, skillom a CLI a lokálne cez stdio číta verejné registre, súdy a predpisy. LAWOSS nič neprevádzkuje.</desc>
