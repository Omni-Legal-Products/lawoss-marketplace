<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-dark-title hero-dark-desc">
  <title id="hero-dark-title">lawoss-marketplace: katalóg právnych MCP pluginov LAWOSS</title>
